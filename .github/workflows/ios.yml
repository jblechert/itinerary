#
# Build for iOS on GitHub's macOS runners, see docs/ios/PORTING.md.
# Builds the dependencies and an unsigned app bundle for arm64 devices.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [android-fork, ios-app]
    paths:
      - 'tools/ios/**'
      - '.github/workflows/ios.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'docs/ios/**'

jobs:
  build:
    # Intel runner: the Apple Silicon ones are frequently not available due to capacity constraints,
    # and Xcode cross-compiles for iOS devices from either
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: brew install ninja gettext gperf bison flex shared-mime-info

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          host: mac
          target: ios
          arch: ios
          autodesktop: true
          modules: 'qtpositioning qtlocation qtmultimedia qtshadertools qtimageformats qtwebsockets'
          cache: true

      # keep partial progress between runs, so a failure doesn't mean starting over
      - name: Restore dependency build
        uses: actions/cache/restore@v4
        with:
          path: ios-prefix
          key: ios-deps-${{ github.run_id }}
          restore-keys: ios-deps-

      - name: Build dependencies
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix gettext)/bin:$PATH"
          # flex rejects the UTF-8 characters in KOpeningHours' scanner unless it reads its input byte-wise
          export LC_ALL=C
          tools/ios/build-deps.sh "$QT_ROOT_DIR" "$PWD/ios-prefix"

      - name: Save dependency build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ios-prefix
          key: ios-deps-${{ github.run_id }}

      - name: Build app
        run: |
          # msgfmt for the translations
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          tools/ios/build-app.sh "$QT_ROOT_DIR" "$PWD/ios-prefix" "$PWD/ios-build"

      - name: Package app bundle
        run: |
          mkdir -p ios-artifacts
          # ditto keeps the bundle structure (symlinks, permissions) intact
          ditto -c -k --keepParent ios-build/bin/*.app ios-artifacts/itinerary-ios-unsigned.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: itinerary-ios-unsigned
          path: ios-artifacts/itinerary-ios-unsigned.zip

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios-prefix/logs
            ios-build/CMakeCache.txt
            ios-build/src/app/.qt/**/*.cpp
            ios-build/src/app/.qt/info_plist/**
